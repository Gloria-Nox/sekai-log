name: Build public site

on:
  push:
    branches: ["main"]
    paths:
      - "_posts/**"
      - "build.py"
      - "shared.css"
      - "shared.js"
      - ".github/workflows/content-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-generated-files:
    if: "!contains(github.event.head_commit.message, '[skip content-sync]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and build public pages
        run: |
          python -m py_compile build.py
          python build.py
      - name: Commit generated files
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all articles index.html all.html anime.html novel.html sf.html subculture.html review.html about.html privacy.html contact.html search.html article.html articles.json feed.xml sitemap.xml robots.txt
          git commit -m "chore: rebuild public site [skip content-sync]"
          git push
