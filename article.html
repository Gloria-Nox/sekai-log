<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>記事を移動しています — SEKAI LOG</title><link rel="stylesheet" href="/shared.css"></head><body><main class="redirect-page"><p>記事を移動しています。</p><a href="/all.html">記事一覧へ</a></main><script>
(async()=>{const p=new URLSearchParams(location.search),slug=p.get('slug');if(!slug)return;try{const all=await fetch('/articles.json').then(r=>r.json());const a=all.find(x=>x.slug===slug||x.legacy_slug===slug);if(a)location.replace('/'+a.url)}catch(e){console.error(e)}})();
</script></body></html>
